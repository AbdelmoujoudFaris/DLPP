[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interfaceshapeai"
version = "0.1.0"
description = "Deep learning prediction of protein-protein interface structure and function from 3D voxelized shape"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Abdelmoujoud Faris" }]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "scikit-learn>=1.3",
    "biopython>=1.83",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    "black>=24.1",
    "mypy>=1.8",
]

[project.scripts]
interfaceshapeai = "interfaceshapeai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
